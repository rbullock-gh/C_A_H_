<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{# title }}</title>
<meta name="description" content="{{# description }}">
<link rel="canonical" href="{{# canonical }}">

<meta property="og:type" content="{{# ogtype }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{# title }}">
<meta property="og:description" content="{{# description }}">
<meta property="og:url" content="{{# canonical }}">
<meta property="og:image" content="{{ site.ogImage }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{# title }}">
<meta name="twitter:description" content="{{# description }}">
<meta name="twitter:image" content="{{ site.ogImage }}">

<meta name="theme-color" content="#143026">
<meta name="geo.region" content="US-MS">
<meta name="geo.placename" content="Columbia, Mississippi">

<link rel="preload" href="{{# base | raw }}assets/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{# base | raw }}assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{# base | raw }}assets/css/styles.css">
<link rel="icon" href="{{# base | raw }}assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{# base | raw }}assets/favicon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{# base | raw }}assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="{{# base | raw }}site.webmanifest">

<script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
{{# schema | raw }}
</head>
<body class="{{# bodyclass }}">
<a class="skip-link" href="#main">Skip to main content</a>
{{> icons }}
{{> header }}
<main id="main">
<!--BODY-->
</main>
{{> footer }}
{{> callbar }}
<script src="{{# base | raw }}assets/js/main.js" defer></script>
</body>
</html>
